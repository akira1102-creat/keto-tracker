<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a5c38">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="酮食記">
  <title>酮食記 — 生酮飲食追蹤</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png">
  <link rel="icon" type="image/x-icon" href="icons/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="splash-screen" class="splash">
      <div class="splash-content">
        <img src="icons/android-chrome-192x192.png" width="80" height="80" alt="酮食記" style="margin-bottom:12px;border-radius:20px">
        <h1>酮食記</h1>
        <p>生酮飲食追蹤</p>
        <div class="spinner"></div>
      </div>
    </div>

    <main id="main-content" class="hidden"></main>

    <nav id="bottom-nav" class="bottom-nav hidden">
      <button class="nav-btn active" data-page="record">
        <span class="nav-icon">📷</span>
        <span class="nav-label">記錄</span>
      </button>
      <button class="nav-btn" data-page="dashboard">
        <span class="nav-icon">📊</span>
        <span class="nav-label">今日</span>
      </button>
      <button class="nav-btn" data-page="history">
        <span class="nav-icon">📅</span>
        <span class="nav-label">歷史</span>
      </button>
      <button class="nav-btn" data-page="settings">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">設定</span>
      </button>
    </nav>
  </div>

  <div id="install-prompt" class="install-prompt hidden">
    <span>加入主畫面，隨時快速記錄</span>
    <button id="install-btn">安裝</button>
    <button id="install-dismiss">✕</button>
  </div>

  <!-- 硬性 fallback：如果 6 秒內 JS 未清除 splash，強制隱藏並重載 -->
  <script>
    window.__splashTimer = setTimeout(function() {
      var splash = document.getElementById('splash-screen');
      if (splash && !splash.classList.contains('hidden')) {
        console.warn('[keto] splash timeout — forcing reload');
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r) { r.unregister(); });
            caches.keys().then(function(keys) {
              return Promise.all(keys.map(function(k) { return caches.delete(k); }));
            }).then(function() {
              window.location.reload(true);
            });
          });
        } else {
          window.location.reload(true);
        }
      }
    }, 6000);

    window.__clearSplashTimer = function() {
      clearTimeout(window.__splashTimer);
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
