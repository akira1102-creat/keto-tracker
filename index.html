<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a5c38">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="酮食記">
  <title>酮食記 — 生酮飲食追蹤</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="splash-screen" class="splash">
      <div class="splash-content">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="80" height="80" style="margin-bottom:12px">
          <rect width="192" height="192" rx="38" fill="#0f1412"/>
          <circle cx="96" cy="96" r="72" fill="none" stroke="#1a5c38" stroke-width="3" opacity="0.5"/>
          <path d="M96 38 C96 38 118 62 118 82 C118 100 108 108 108 108 C108 90 96 84 88 72 C84 88 90 100 84 112 C76 104 72 94 72 82 C72 62 96 38 96 38Z" fill="#4caf50" opacity="0.95"/>
          <path d="M96 58 C96 58 110 74 110 86 C110 96 104 102 104 102 C104 90 96 84 91 76 C89 86 93 94 89 103 C84 97 82 90 82 84 C82 70 96 58 96 58Z" fill="#d4a017" opacity="0.9"/>
          <path d="M80 128 C80 128 88 118 96 120 C104 118 112 128 112 128 C112 128 104 138 96 136 C88 138 80 128 80 128Z" fill="#1a5c38" stroke="#4caf50" stroke-width="1.5"/>
        </svg>
        <h1>酮食記</h1>
        <p>生酮飲食追蹤</p>
        <div class="spinner"></div>
      </div>
    </div>

    <main id="main-content" class="hidden"></main>

    <nav id="bottom-nav" class="bottom-nav hidden">
      <button class="nav-btn active" data-page="record">
        <span class="nav-icon">📷</span>
        <span class="nav-label">記錄</span>
      </button>
      <button class="nav-btn" data-page="dashboard">
        <span class="nav-icon">📊</span>
        <span class="nav-label">今日</span>
      </button>
      <button class="nav-btn" data-page="history">
        <span class="nav-icon">📅</span>
        <span class="nav-label">歷史</span>
      </button>
      <button class="nav-btn" data-page="settings">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">設定</span>
      </button>
    </nav>
  </div>

  <div id="install-prompt" class="install-prompt hidden">
    <span>加入主畫面，隨時快速記錄</span>
    <button id="install-btn">安裝</button>
    <button id="install-dismiss">✕</button>
  </div>

  <!-- 硬性 fallback：如果 6 秒內 JS 未清除 splash，強制隱藏並重載 -->
  <script>
    window.__splashTimer = setTimeout(function() {
      var splash = document.getElementById('splash-screen');
      if (splash && !splash.classList.contains('hidden')) {
        console.warn('[keto] splash timeout — forcing reload');
        // 嘗試卸載 service worker 再重載
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r) { r.unregister(); });
            // 清除所有 cache
            caches.keys().then(function(keys) {
              return Promise.all(keys.map(function(k) { return caches.delete(k); }));
            }).then(function() {
              window.location.reload(true);
            });
          });
        } else {
          window.location.reload(true);
        }
      }
    }, 6000);

    // app.js 載入後會呼叫此函數取消 timer
    window.__clearSplashTimer = function() {
      clearTimeout(window.__splashTimer);
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
